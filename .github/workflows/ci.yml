name: Android CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Whitespace check
        run: git diff --check HEAD^1 HEAD
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build and unit tests
        shell: bash
        run: |
          if [[ ! -x gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f app/build.gradle.kts ]]; then
            echo '::error::Android baseline or Gradle wrapper is incomplete.'
            exit 1
          fi
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease
      - name: Merged manifest security guard
        shell: bash
        run: |
          java scripts/security/ManifestGuard.java --policy scripts/security/manifest-policy.txt \
            app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          java scripts/security/ManifestGuard.java --release --policy scripts/security/manifest-policy.txt \
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
